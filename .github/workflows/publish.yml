name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release tag
        id: release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<year>2019|202[0-7])\.0\.(?<patch>[1-9][0-9]*)$') {
            throw "Tag '$tag' must match vYYYY.0.PATCH for AutoCAD 2019-2027."
          }

          $year = [int]$Matches.year
          $version = $tag.Substring(1)
          $metadataPath = "metadata/$year.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.wrapperVersion -ne $version) {
            throw "Tag version '$version' does not match $metadataPath wrapperVersion '$($metadata.wrapperVersion)'."
          }

          "year=$year" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Pack selected facade
        shell: powershell
        run: ./build/Pack.ps1 -Year ${{ steps.release.outputs.year }} -OutputDirectory ./artifacts/packages

      - name: Verify selected package and consumer
        shell: powershell
        run: ./tests/package-contract.ps1 -Year ${{ steps.release.outputs.year }} -PackageDirectory ./artifacts/packages

      - name: NuGet login with OIDC
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: powershell
        run: |
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\packages -Filter *.nupkg -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package to publish, found $($packages.Count)."
          }

          dotnet nuget push $packages[0].FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
